<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche casque — La Poste</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #F4F4F2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
  }
  .card { background: #fff; border-radius: 16px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
  .card-header { background: #FFCD00; padding: 1.5rem 1.75rem 1.25rem; display: flex; align-items: center; gap: 1rem; }
  .logo-poste { font-size: 22px; font-weight: 800; color: #1A1A1A; letter-spacing: -0.5px; line-height: 1; }
  .logo-sub { font-size: 11px; font-weight: 500; color: rgba(0,0,0,0.5); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }
  .envelope { margin-left: auto; font-size: 36px; opacity: 0.25; }
  .card-title { background: #1A1A1A; padding: 0.75rem 1.75rem; }
  .card-title p { font-size: 11px; font-weight: 600; color: #FFCD00; letter-spacing: 0.1em; text-transform: uppercase; }
  .card-title h1 { font-size: 17px; font-weight: 600; color: #fff; line-height: 1.3; margin-top: 2px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 0.875rem 1.75rem; border-bottom: 1px solid #F0F0EE; gap: 1rem; }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 12px; color: #999; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
  .info-value { font-size: 14px; color: #1A1A1A; font-weight: 600; text-align: right; }
  .serial-badge { font-family: 'Courier New', monospace; font-size: 14px; font-weight: 700; color: #1A1A1A; background: #FFF8D6; border: 1.5px solid #FFCD00; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.05em; }
  .card-footer { background: #FAFAF8; border-top: 1px solid #F0F0EE; padding: 0.875rem 1.75rem; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c8e6c9; border: 2px solid #4CAF50; flex-shrink: 0; }
  .footer-text { font-size: 12px; color: #999; }
  .error-state { padding: 2rem 1.75rem; text-align: center; }
  .error-state .icon { font-size: 36px; margin-bottom: 12px; }
  .error-state h2 { font-size: 16px; color: #1A1A1A; margin-bottom: 8px; }
  .error-state p { font-size: 13px; color: #999; }
  .loading { padding: 2.5rem 1.75rem; text-align: center; color: #999; font-size: 14px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading">Chargement…</div>
</div>
<script>
  const BASE = 'https://icc-sarl.github.io/casque-la-poste/';
  function getParam(name) { return new URLSearchParams(window.location.search).get(name); }
  function header() {
    return `<div class="card-header"><div><div class="logo-poste">La Poste</div><div class="logo-sub">Équipement agent</div></div><div class="envelope">✉</div></div>`;
  }
  function renderCasque(d) {
    document.getElementById('card').innerHTML = header() + `
      <div class="card-title"><p>Fiche produit</p><h1>${d.designation}</h1></div>
      <div>
        <div class="info-row"><span class="info-label">Taille</span><span class="info-value">${d.taille}</span></div>
        <div class="info-row"><span class="info-label">N° Marché</span><span class="info-value">${d.marche}</span></div>
        <div class="info-row"><span class="info-label">Date livraison</span><span class="info-value">${d.livraison}</span></div>
        <div class="info-row"><span class="info-label">N° Unique</span><span class="serial-badge">${d.serial}</span></div>
      </div>
      <div class="card-footer"><div class="dot"></div><span class="footer-text">Casque enregistré — Marché n° ${d.marche}</span></div>`;
    document.title = d.serial + ' — La Poste';
  }
  function renderError(id) {
    document.getElementById('card').innerHTML = header() + `
      <div class="error-state"><div class="icon">⚠️</div><h2>Casque introuvable</h2><p>Le numéro <strong>${id||'—'}</strong> ne correspond à aucun casque enregistré.</p></div>`;
  }
  async function init() {
    const id = getParam('id');
    if (!id) { renderError(null); return; }
    try {
      const res = await fetch(BASE + 'data.json');
      const data = await res.json();
      const casque = data[id.toUpperCase()];
      casque ? renderCasque(casque) : renderError(id);
    } catch(e) { renderError(id); }
  }
  init();
</script>
</body>
</html>
